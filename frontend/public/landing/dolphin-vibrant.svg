  <path d="M15,205 C5,220 0,230 0,235 C5,225 15,215 25,200 Z" fill="#0284c7" />

  <!-- Eye & Smile -->
  <circle cx="440" cy="100" r="3.5" fill="#082f49" />
  <circle cx="441" cy="99" r="1.2" fill="#ffffff" />
  <path d="M455,108 C465,112 475,115 480,116" stroke="#082f49" stroke-width="1.5" stroke-linecap="round" />
</svg>
